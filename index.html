<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio</title>

    <style>
        table {
            border: 2px solid blue;
            width: 500px;
            height: 300px;
        }

        td {
            border: 1px solid blue;
            text-align: center;
        }

        .titulo {
            background-color: yellow;
        }

        .atletico {
            background-color: red;
            color: white;
            font-size: 35px;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td colspan="2" class="titulo">Buenos días</td>
        </tr>

        <tr>
            <td>lo</td>
            <td>primero</td>
        </tr>

        <tr>
            <td>lo</td>
            <td>segundo</td>
        </tr>

        <tr>
            <td>el</td>
            <td rowspan="2" class="atletico">Atlético</td>
        </tr>
    </table>

</body>
</html>
